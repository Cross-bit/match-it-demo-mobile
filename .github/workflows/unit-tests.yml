name: Android Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local.properties
        run: |
          cat <<'EOF' > local.properties
          DEV_SERVER_IP=127.0.0.1
          GOOGLE_MAPS_API_KEY=dummy
          EOF

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDevEmuDebugUnitTest --stacktrace
